<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>Cash Drawer Test</title>
<style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f1f5f9; }
    .box { background: white; border-radius: 12px; padding: 25px; max-width: 560px; margin: 0 auto; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    h2 { margin-top: 0; }
    button { display: block; width: 100%; margin: 14px 0; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    .b1 { background: #16a34a; color: white; }
    .b2 { background: #2563eb; color: white; }
    .note { font-size: 14px; color: #475569; line-height: 1.6; }
    @media print {
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }
        #print-area { position: absolute; left: 0; top: 0; width: 72mm; font-family: monospace; }
    }
</style>
</head>
<body>
<div class="box">
    <h2>Cash Drawer Test</h2>
    <p class="note">
        1. முதல்ல <b>Test 1 (Drawer #2)</b> கிளிக் பண்ணுங்க -&gt; Print கிளிக் பண்ணுங்க -&gt; drawer open ஆகுதானு பாருங்க.<br>
        2. open ஆகலைனா <b>Test 2 (Drawer #1)</b> கிளிக் பண்ணுங்க -&gt; Print கிளிக் பண்ணுங்க -&gt; மறுபடி பாருங்க.<br>
        3. எந்த test-ல drawer open ஆச்சுனு மட்டும் சொல்லுங்க.
    </p>
    <button class="b1" onclick="doPrint(1)">TEST 1 - Drawer #2 (pin 5)</button>
    <button class="b2" onclick="doPrint(2)">TEST 2 - Drawer #1 (pin 2)</button>
</div>

<div id="print-area">
    DRAWER TEST PAGE
    <div id="kick" style="display:none;"></div>
</div>

<script>
    // Real ESC/POS bytes: ESC 'p' m 25 250 built from escapes (robust encoding)
    var KICK2 = '\x1B' + 'p' + '\x01' + '\x19' + '\xFA';
    var KICK1 = '\x1B' + 'p' + '\x00' + '\x19' + '\xFA';
    function doPrint(which) {
        document.getElementById('kick').textContent = (which === 1) ? KICK2 : KICK1;
        window.print();
    }
</script>
</body>
</html>
