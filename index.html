<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Hussain Restaurant - POS System</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f1f5f9; margin: 0; color: #1e293b; overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #4f46e5, #3b82f6); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; }
        .login-box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); width: 100%; max-width: 360px; text-align: center; }
        .login-box h2 { color: #334155; margin-bottom: 30px; font-weight: 800; font-size: 24px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 18px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 15px; font-family: inherit; transition: 0.3s; }
        .login-box input:focus { border-color: #4f46e5; outline: none; }
        .btn-login { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; font-family: inherit; }
        .btn-login:hover { opacity: 0.9; transform: translateY(-2px); }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        
        .timeout-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(241, 245, 249, 0.95); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; text-align: center; }
        .timeout-box { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .timeout-box h1 { color: #ef4444; font-size: 48px; margin: 0 0 15px 0; }
        .timeout-box h2 { color: #1e293b; margin-top: 0; margin-bottom: 10px; font-size: 22px; font-weight: 800; }
        .timeout-box p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0; font-weight: 600; }

        .header { background: white; padding: 8px 15px; margin: 8px 10px 0 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); flex-shrink: 0; }
        .header h2 { margin: 0; font-size: 15px; font-weight: 800; color: #4f46e5; display: flex; align-items: center; gap: 6px; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .btn-logout { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .btn-logout:hover { background: #ef4444; color: white; }
        
        #table-selection-view { display: flex; flex-direction: column; flex: 1; padding: 15px; box-sizing: border-box; overflow-y: auto; background: #f8fafc; gap: 12px; }
        .table-selection-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); flex-shrink: 0; }
        .table-selection-header h2 { margin: 0; color: #0f172a; font-size: 17px; font-weight: 900; }
        
        .big-tables-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        @media (max-width: 1100px) { .big-tables-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .big-tables-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 550px) { .big-tables-grid { grid-template-columns: repeat(2, 1fr); } }

        .big-table-card { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 3px 8px rgba(0,0,0,0.02); position: relative; }
        .big-table-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(79, 70, 229, 0.08); border-color: #4f46e5; }
        .big-table-card.occupied { background: linear-gradient(135deg, #fee2e2, #fecaca); border-color: #f87171; }
        .big-table-card.free { background: linear-gradient(135deg, #dcfce7, #bbf7d0); border-color: #4ade80; }
        .big-table-card h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: 900; color: #1e293b; }
        .big-table-card p { margin: 0; font-size: 11px; font-weight: 800; color: #64748b; line-height: 1.3; }

        #pos-main-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        
        .mobile-tab-bar { display: none; background: white; padding: 8px 15px; gap: 10px; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
        .mob-tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; background: #f1f5f9; color: #64748b; font-family: inherit; transition: 0.2s; }
        .mob-tab-btn.active { background: #4f46e5; color: white; }

        .main-layout { display: flex; flex: 1; padding: 10px; box-sizing: border-box; gap: 12px; overflow: hidden; }
        .left-panel { flex: 6.5; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .right-panel { flex: 3.5; background: white; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; overflow-y: auto; padding: 12px; box-sizing: border-box; height: 100%; }
        
        @media (max-width: 900px) {
            .mobile-tab-bar { display: flex; }
            .main-layout { padding: 8px; }
            .left-panel.mobile-hidden, .right-panel.mobile-hidden { display: none !important; }
            .left-panel, .right-panel { flex: 1; height: 100%; }
        }

        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; background: white; padding: 8px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); flex-shrink: 0; }
        .search-container { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 380px; }
        .search-box { padding: 7px 12px; border-radius: 8px; border: 1px solid #e2e8f0; width: 100%; outline: none; font-size: 13px; font-family: inherit; background: #f8fafc; transition: 0.3s; }
        .search-box:focus { border-color: #4f46e5; background: white; }
        
        .btn-menu-refresh { background: #e0f2fe; color: #0284c7; border: none; padding: 7px 10px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .btn-menu-refresh:hover { background: #0284c7; color: white; }
        .btn-clear { background: #fef2f2; color: #ef4444; }
        .btn-clear:hover { background: #ef4444; color: white; }

        .category-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; width: 100%; scroll-behavior: smooth; }
        .cat-btn { background: white; border: 1px solid #e2e8f0; padding: 5px 12px; border-radius: 20px; color: #64748b; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 12px; font-family: inherit; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: #4f46e5; color: white; border-color: #4f46e5; transform: translateY(-1px); }
        
        .category-section-header { grid-column: 1 / -1; font-size: 16px; font-weight: 900; color: #0f172a; padding: 15px 0 5px 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .category-section-header:first-child { padding-top: 0; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; overflow-y: auto; padding-right: 4px; padding-bottom: 15px; flex: 1; align-content: start; }
        
        .menu-card { background: white; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; position: relative; border: 1px solid #f1f5f9; cursor: pointer; transition: all 0.3s; height: 105px; box-sizing: border-box; box-shadow: 0 3px 5px rgba(0,0,0,0.02); }
        .menu-card:hover { border-color: #c7d2fe; box-shadow: 0 8px 15px rgba(79, 70, 229, 0.08); transform: translateY(-2px); }
        
        .card-code { position: absolute; top: 8px; left: 8px; background: #f1f5f9; color: #64748b; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 5px; }
        .card-icon { position: absolute; top: 8px; right: 8px; font-size: 18px; }
        .card-title { font-weight: 800; font-size: 13px; margin-top: 22px; color: #1e293b; line-height: 1.2; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .card-price { font-weight: 900; font-size: 15px; color: #4f46e5; }
        .btn-add { background: #4f46e5; color: white; width: 24px; height: 24px; border-radius: 6px; font-size: 14px; display: flex; justify-content: center; align-items: center; font-weight: bold; opacity: 0; transition: 0.3s; }
        .menu-card:hover .btn-add { opacity: 1; }
        .card-qty-badge { position: absolute; top: 8px; right: 35px; background: #dc2626; color: white; font-size: 11px; font-weight: 900; padding: 1px 6px; border-radius: 10px; box-shadow: 0 2px 5px rgba(220, 38, 38, 0.3); }

        .right-panel h3 { margin-top: 0; color: #0f172a; font-size: 15px; font-weight: 800; margin-bottom: 8px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .cart-table-wrapper { height: auto; margin-bottom: 8px; padding-right: 4px; min-height: 80px; overflow-y: visible; flex-shrink: 0; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        th { color: #94a3b8; padding: 0 6px; text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        td { padding: 8px 6px; background: #fef08a; vertical-align: top; }
        td:first-child { border-radius: 8px 0 0 8px; }
        td:last-child { border-radius: 0 8px 8px 0; }
        
        .cart-item-name { font-weight: 800; font-size: 12px; color: #1e293b; margin-bottom: 3px; }
        .note-checkboxes { display: flex; gap: 5px; margin-top: 3px; flex-wrap: wrap; }
        .note-label { background: white; color: #64748b; border: 1px solid #e2e8f0; padding: 2px 5px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
        .note-label input { accent-color: #4f46e5; width: 10px; height: 10px; cursor: pointer; }
        .comment-input { width: 95%; padding: 4px 6px; margin-top: 3px; border: 1px solid #e2e8f0; background: white; border-radius: 5px; font-size: 11px; outline: none; font-family: inherit; }
        .price-input { width: 55px; padding: 4px; border: 1px solid #e2e8f0; border-radius: 5px; text-align: right; font-weight: 800; font-size: 12px; outline: none; background: white; color: #4f46e5; font-family: inherit; }
        
        .qty-controls { display: flex; align-items: center; gap: 6px; background: white; padding: 2px; border-radius: 5px; border: 1px solid #e2e8f0; width: max-content; }
        .qty-btn { background: transparent; border: none; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-weight: bold; color: #4f46e5; font-size: 13px; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: #f1f5f9; }
        .qty-controls span { font-weight: 900; font-size: 14px; width: 18px; text-align: center; color: #dc2626; }
        
        .bill-summary { background: #f8fafc; padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #f1f5f9; flex-shrink: 0; }
        .summary-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 5px; align-items: center; }
        .summary-row input { width: 70px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 5px; text-align: right; outline: none; font-weight: bold; font-family: inherit; }
        .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 900; color: #0f172a; margin-top: 6px; border-top: 2px dashed #e2e8f0; padding-top: 8px; }
        
        #payment-method { padding: 5px 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 800; background: white; font-size: 11px; font-family: inherit; outline: none; cursor: pointer; color: #334155; }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; margin-bottom: 12px; }
        .action-buttons button { border: none; padding: 9px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 11px; font-family: inherit; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .action-buttons button:hover { transform: translateY(-1px); opacity: 0.9; }
        
        .btn-hold { background: #fffbeb; color: #d97706; border: 1px solid #fde68a !important; }
        .btn-kitchen { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd !important; }
        .btn-print-bill { background: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe !important; }
        .btn-pay { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0 !important; font-size: 12px; }
        .btn-drawer { grid-column: span 2; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0 !important; padding: 7px !important; }
        .btn-back-tables { grid-column: span 2; background: #64748b; color: white; padding: 9px; font-size: 12px; border-radius: 8px; }

        .btn-ready-order { grid-column: span 2; background: #10b981; color: white; border: none; padding: 9px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 12px; }
        .btn-ready-order:hover { background: #059669; }

        #customer-action-div { display: none; margin-top: 10px; flex-shrink: 0; flex-direction: column; gap: 8px; }
        .btn-customer-send { width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); transition: 0.3s; }
        .btn-customer-send:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); }
        .btn-call-waiter { width: 100%; padding: 12px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .admin-dashboard-container { background: white; padding: 12px 15px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: none; margin-top: 4px; }
        .admin-dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 8px; }
        .admin-dashboard-header h3 { margin: 0; color: #0f172a; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        
        .btn-small { background: #4f46e5; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; font-family: inherit; }
        .btn-cat-add { background: #059669; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; font-family: inherit; }
        .stat-box { background: #f8fafc; padding: 4px 8px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; font-size: 12px; font-weight: 900; color: #4f46e5; }
        
        .admin-buttons-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .admin-btn { color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 8px; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .admin-btn:hover { opacity: 0.9; transform: translateX(2px); }
        .manage-menu-btn { background: #0284c7; }
        .manage-cat-btn { background: #7c3aed; }
        .stock-btn { background: #8b5cf6; }
        .qr-btn { background: #059669; }
        .report-btn { background: #0d9488; }
        .expense-btn { background: #ea580c; }
        .monthly-btn { background: #2563eb; }
        .staff-btn { background: #d97706; }
        .history-btn { background: #475569; }
        .close-day-btn { background: #dc2626; text-align: center; justify-content: center; font-size: 12px; padding: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; width: 100%; max-width: 750px; max-height: 85vh; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        .modal-body { overflow-y: auto; margin-top: 15px; max-height: 60vh; }
        .close-modal { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .pay-modal-box { background: white; width: 100%; max-width: 400px; text-align: center; border-radius: 24px; padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); box-sizing: border-box; }
        .pay-modal-box h2 { color: #1e293b; margin-top: 0; margin-bottom: 15px; font-size: 22px; font-weight: 800; }
        .pay-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; font-weight: 800; color: #475569; background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid #f1f5f9; }
        .pay-row span.val { font-size: 22px; color: #0f172a; font-weight: 900; }
        .pay-input-box { width: 100%; padding: 12px; font-size: 22px; font-weight: 900; text-align: center; border: 2px solid #e2e8f0; border-radius: 14px; outline: none; box-sizing: border-box; color: #4f46e5; background: white; margin-bottom: 12px; font-family: inherit; }

        .quick-cash-btn { background: #f1f5f9; color: #475569; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }
